name: Publish to JSR
on:
  push:
    branches:
      - release

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4.4.0

      - uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install

      - name: Publish package
        run: npx jsr publish
